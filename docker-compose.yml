services:
  # Service Backend REST API untuk Aplikasi Mobile
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: katalog_backend_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: app_user
      DB_PASSWORD: app_password
      DB_NAME: katalog_db
    depends_on:
      - db
    networks:
      - mobile-app-net

  # Service Database MySQL
  db:
    image: mysql:8.0
    container_name: katalog_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: katalog_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mobile-app-net

networks:
  mobile-app-net:
    driver: bridge

volumes:
  db_data: